<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genre — Anime Verse</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ============ PAGE LAYOUT ============ */
    .genre-page {
      max-width: 1400px;
      margin: 0 auto;
      padding: 20px 16px 100px;
      perspective: 1200px;
    }
    .genre-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 10px 0 18px;
      flex-wrap: wrap;
    }
    .genre-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(28px, 5vw, 48px);
      letter-spacing: 2px;
      margin: 0;
      color: var(--text, #fff);
    }
    .genre-title .accent {
      color: var(--accent, #FB3640);
    }
    .genre-count {
      color: var(--text2, #aaa);
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      margin-left: auto;
      background: var(--bg3, rgba(255,255,255,0.06));
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border, rgba(255,255,255,0.08));
    }

    /* ============ SEARCH BAR ============ */
    .genre-search-wrap {
      position: relative;
      margin: 0 0 22px;
    }
    .genre-search {
      width: 100%;
      padding: 14px 46px 14px 46px;
      border-radius: 14px;
      border: 1px solid var(--border, rgba(255,255,255,0.10));
      background: var(--bg2, rgba(255,255,255,0.04));
      color: var(--text, #fff);
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .25s, box-shadow .25s, background .25s;
    }
    .genre-search:focus {
      border-color: var(--accent, #FB3640);
      box-shadow: 0 0 0 3px rgba(251,54,64,0.18);
    }
    .genre-search::placeholder { color: var(--text2, #888); }
    .genre-search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent, #FB3640);
      font-size: 15px;
      pointer-events: none;
    }
    .genre-search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: var(--text2, #888);
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      transition: background .2s, color .2s;
    }
    .genre-search-clear:hover {
      background: rgba(251,54,64,0.15);
      color: var(--accent, #FB3640);
    }
    .genre-search-clear.show { display: flex; }

    /* ============ GRID — 2 PER ROW ============ */
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
    }
    @media (min-width: 768px) {
      .genre-grid { gap: 22px; }
    }

    /* ============ 3D AURORA CARD ============ */
    .g-card {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transform-style: preserve-3d;
      transform: perspective(900px) rotateX(0deg) rotateY(0deg) translateZ(0);
      transition: transform .45s cubic-bezier(.2,.9,.3,1.2), box-shadow .35s ease;
      animation: gFadeUp .5s ease both;
      will-change: transform;
      border: 1px solid var(--border, rgba(255,255,255,0.08));
      background: var(--card-bg, #0A1A10);
      box-shadow:
        0 6px 16px rgba(0,0,0,0.35),
        0 2px 4px rgba(0,0,0,0.25);
    }
    .g-card::before {
      /* gloss highlight for 3D feel */
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(125deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0) 35%, rgba(255,255,255,0) 65%, rgba(255,255,255,0.05) 100%);
      pointer-events: none;
      z-index: 3;
      opacity: 0.7;
      transition: opacity .35s ease;
    }
    .g-card:hover {
      transform: perspective(900px) rotateX(4deg) rotateY(-6deg) translateY(-6px) translateZ(10px);
      box-shadow:
        0 24px 50px rgba(0,0,0,0.55),
        0 12px 22px rgba(251,54,64,0.18),
        0 0 0 1px var(--accent, #FB3640);
    }
    :root[data-theme="light"] .g-card:hover {
      box-shadow:
        0 24px 50px rgba(13,10,74,0.30),
        0 12px 22px rgba(117,139,253,0.30),
        0 0 0 1px #758BFD;
    }
    .g-card:active {
      transform: perspective(900px) rotateX(2deg) rotateY(-3deg) translateY(-2px) scale(0.99);
    }
    .g-card .poster {
      width: 100%;
      aspect-ratio: 2 / 3;
      object-fit: cover;
      display: block;
      background: #111;
      transform: translateZ(20px);
    }
    .g-card .heart {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 14px;
      z-index: 4;
      border: 1px solid rgba(255,255,255,0.15);
      transition: color .2s, background .2s, transform .2s;
    }
    .g-card .heart:hover { color: var(--accent, #FB3640); transform: scale(1.08); }
    .g-card .heart.saved { color: var(--accent, #FB3640); }

    /* Aurora info panel — matches the home cards */
    .g-card .info {
      padding: 12px 12px 14px;
      position: relative;
      z-index: 2;
      transform: translateZ(15px);
    }
    :root[data-theme="dark"] .g-card .info {
      background: linear-gradient(135deg, #030908, #0e1f18, #FB3640, #0e1f18, #030908);
      background-size: 300% 300%;
      animation: cardShine 4s ease infinite;
    }
    :root[data-theme="light"] .g-card .info {
      background: linear-gradient(135deg, #0D0A4A, #27187E, #758BFD, #27187E, #0D0A4A);
      background-size: 300% 300%;
      animation: cardShine 4s ease infinite;
    }
    .g-card .badge {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 10px;
      letter-spacing: 0.6px;
      color: #fff;
      padding: 3px 9px;
      border-radius: 6px;
      background: rgba(255,255,255,0.20);
      margin-bottom: 7px;
      text-transform: uppercase;
    }
    .g-card .t {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 14px;
      color: #fff;
      margin: 0 0 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
      min-height: 2.6em;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .g-card .m {
      font-size: 11px;
      color: rgba(255,255,255,0.72);
      display: flex;
      justify-content: space-between;
      gap: 6px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
    }
    .g-card .m .rating { color: #FFD700; display: flex; align-items: center; gap: 4px; }
    .g-card .m .rating i { font-size: 10px; }
    .g-card .m .year { color: rgba(255,255,255,0.7); }

    /* ============ PAGINATION ============ */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin: 32px 0 10px;
      flex-wrap: wrap;
      font-family: 'Poppins', sans-serif;
    }
    .pg-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1px solid var(--border, rgba(255,255,255,0.10));
      background: var(--bg2, rgba(255,255,255,0.04));
      color: var(--text, #fff);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .2s ease;
    }
    .pg-btn:hover:not(:disabled) {
      border-color: var(--accent, #FB3640);
      color: var(--accent, #FB3640);
      transform: translateY(-2px);
    }
    .pg-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .pg-btn.active {
      background: var(--accent, #FB3640);
      color: #fff;
      border-color: var(--accent, #FB3640);
      box-shadow: 0 6px 14px rgba(251,54,64,0.35);
    }
    :root[data-theme="light"] .pg-btn.active {
      background: #758BFD;
      border-color: #758BFD;
      box-shadow: 0 6px 14px rgba(117,139,253,0.45);
    }
    .pg-ellipsis {
      color: var(--text2, #888);
      padding: 0 4px;
      font-weight: 700;
    }
    .pg-info {
      width: 100%;
      text-align: center;
      color: var(--text2, #888);
      font-size: 12px;
      margin-top: 8px;
    }

    /* ============ STATES ============ */
    .empty-state, .loading-state {
      text-align: center;
      padding: 70px 20px;
      color: var(--text2, #888);
      font-family: 'Poppins', sans-serif;
      grid-column: 1 / -1;
    }
    .empty-state i, .loading-state i {
      font-size: 44px;
      margin-bottom: 14px;
      color: var(--accent, #FB3640);
    }
    .empty-state h3 { margin: 8px 0 6px; color: var(--text, #fff); }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(251,54,64,0.2);
      border-top-color: var(--accent, #FB3640);
      border-radius: 50%;
      margin: 0 auto 14px;
      animation: spin 1s linear infinite;
    }

    /* ============ ANIMATIONS ============ */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes cardShine {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes gFadeUp {
      from { opacity: 0; transform: perspective(900px) rotateX(-8deg) translateY(28px); }
      to   { opacity: 1; transform: perspective(900px) rotateX(0deg) translateY(0); }
    }

    /* small screens — keep 2 per row but tighten */
    @media (max-width: 380px) {
      .g-card .t { font-size: 13px; }
      .g-card .info { padding: 10px 10px 12px; }
      .pg-btn { min-width: 34px; height: 34px; font-size: 12px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <button class="icon-btn" onclick="history.back()" aria-label="Back">
        <i class="fas fa-arrow-left"></i>
      </button>
      <a href="index.html" class="logo">ANIME <span>VERSE</span></a>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()" aria-label="Toggle theme">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="genre-page">
      <div class="genre-header">
        <h1 class="genre-title">
          <span class="accent" id="genreTitle">Genre</span>
        </h1>
        <span class="genre-count" id="genreCount" style="display:none"></span>
      </div>

      <!-- Search bar -->
      <div class="genre-search-wrap">
        <i class="fas fa-search genre-search-icon"></i>
        <input
          type="text"
          id="genreSearch"
          class="genre-search"
          placeholder="Search in this genre..."
          autocomplete="off"
        />
        <button class="genre-search-clear" id="genreSearchClear" aria-label="Clear">
          <i class="fas fa-xmark"></i>
        </button>
      </div>

      <div id="genreContent">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading anime...</p>
        </div>
      </div>

      <div id="paginationWrap"></div>
    </div>
  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    /* ---------- Theme ---------- */
    function toggleTheme() {
      const html = document.documentElement;
      const btn  = document.getElementById('themeBtn');
      const dark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', dark ? 'light' : 'dark');
      btn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      localStorage.setItem('av_theme', dark ? 'light' : 'dark');
    }
    (function loadTheme(){
      const saved = localStorage.getItem('av_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerHTML = saved === 'dark'
        ? '<i class="fas fa-moon"></i>'
        : '<i class="fas fa-sun"></i>';
    })();

    /* ---------- Get genre from URL ---------- */
    const params    = new URLSearchParams(window.location.search);
    const genreName = (params.get('name') || '').trim();
    document.getElementById('genreTitle').textContent = genreName || 'All Anime';
    document.title = (genreName || 'All Anime') + ' — Anime Verse';

    /* ---------- Genre matcher ---------- */
    function matchesGenre(data, target) {
      if (!target) return true;
      const t = target.toLowerCase().trim();
      const list = [];
      ['genre', 'genres'].forEach(k => {
        const v = data[k];
        if (Array.isArray(v)) v.forEach(x => list.push(x));
        else if (typeof v === 'string') v.split(',').forEach(x => list.push(x));
      });
      return list.some(g => String(g).toLowerCase().trim() === t);
    }

    /* ---------- Pagination state ---------- */
    const PAGE_SIZE = 10;
    let allMatches = [];        // all anime that match the genre
    let filtered   = [];        // after search filter
    let currentPage = 1;
    let savedSet = new Set();   // for heart icons (localStorage)

    /* ---------- LocalStorage saved list ---------- */
    function loadSaved() {
      try {
        const raw = localStorage.getItem('av_saved') || '[]';
        savedSet = new Set(JSON.parse(raw));
      } catch(_) { savedSet = new Set(); }
    }
    function persistSaved() {
      localStorage.setItem('av_saved', JSON.stringify([...savedSet]));
    }
    function toggleSaved(id, btn) {
      if (savedSet.has(id)) { savedSet.delete(id); btn.classList.remove('saved'); }
      else { savedSet.add(id); btn.classList.add('saved'); }
      persistSaved();
    }

    /* ---------- 3D tilt on pointer move ---------- */
    function attachTilt(card) {
      let rect = null;
      card.addEventListener('mouseenter', () => { rect = card.getBoundingClientRect(); });
      card.addEventListener('mousemove', (e) => {
        if (!rect) rect = card.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top)  / rect.height;
        const rx = (0.5 - y) * 10;   // tilt up/down
        const ry = (x - 0.5) * 14;   // tilt left/right
        card.style.transform =
          `perspective(900px) rotateX(${rx}deg) rotateY(${ry}deg) translateY(-6px) translateZ(10px)`;
      });
      card.addEventListener('mouseleave', () => {
        rect = null;
        card.style.transform = '';
      });
    }

    /* ---------- Render ---------- */
    function renderPage() {
      const container = document.getElementById('genreContent');
      const pagWrap   = document.getElementById('paginationWrap');
      const counter   = document.getElementById('genreCount');

      counter.style.display = '';
      counter.textContent = filtered.length + (filtered.length === 1 ? ' result' : ' results');

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-ghost"></i>
            <h3>Nothing here yet</h3>
            <p>No anime found${genreName ? ` in "<strong>${genreName}</strong>"` : ''}.</p>
          </div>`;
        pagWrap.innerHTML = '';
        return;
      }

      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const start = (currentPage - 1) * PAGE_SIZE;
      const end   = start + PAGE_SIZE;
      const slice = filtered.slice(start, end);

      const grid = document.createElement('div');
      grid.className = 'genre-grid';

      slice.forEach((a, i) => {
        const card = document.createElement('div');
        card.className = 'g-card';
        card.style.animationDelay = (i * 0.04) + 's';

        const poster = a.thumbnail || a.poster || a.image || a.banner || '';
        const title  = a.title || a.name || 'Untitled';
        const year   = a.year || a.releaseYear || '';
        const studio = a.studio || a.type || '';
        const rating = a.rating || a.score || '';
        const type   = (a.type || a.category || 'ANIME').toString().toUpperCase();
        const isSaved = savedSet.has(a.firestoreId);

        card.innerHTML = `
          <img class="poster" src="${poster}" alt="${escapeHtml(title)}" loading="lazy"
               onerror="this.style.background='#222';this.removeAttribute('src');">
          <button class="heart ${isSaved ? 'saved' : ''}" aria-label="Save">
            <i class="${isSaved ? 'fas' : 'far'} fa-heart"></i>
          </button>
          <div class="info">
            <span class="badge">${escapeHtml(type)}</span>
            <p class="t">${escapeHtml(title)}</p>
            <div class="m">
              ${rating ? `<span class="rating"><i class="fas fa-star"></i>${rating}</span>` : `<span class="year">${escapeHtml(studio)}</span>`}
              <span class="year">${escapeHtml(String(year))}</span>
            </div>
          </div>`;

        // Heart button
        const heartBtn = card.querySelector('.heart');
        heartBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const icon = heartBtn.querySelector('i');
          toggleSaved(a.firestoreId, heartBtn);
          if (savedSet.has(a.firestoreId)) { icon.classList.remove('far'); icon.classList.add('fas'); }
          else { icon.classList.remove('fas'); icon.classList.add('far'); }
        });

        // Navigate on card click
        card.addEventListener('click', () => {
          window.location.href = 'anime.html?id=' + encodeURIComponent(a.firestoreId);
        });

        // 3D tilt
        attachTilt(card);

        grid.appendChild(card);
      });

      container.innerHTML = '';
      container.appendChild(grid);

      // Pagination
      pagWrap.innerHTML = '';
      pagWrap.appendChild(buildPagination(totalPages));

      // Smooth scroll to top of grid on page change
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildPagination(totalPages) {
      const wrap = document.createElement('div');
      const nav  = document.createElement('div');
      nav.className = 'pagination';

      // Prev
      const prev = mkBtn('<i class="fas fa-chevron-left"></i>', () => goTo(currentPage - 1));
      prev.disabled = currentPage === 1;
      nav.appendChild(prev);

      // Page numbers with ellipsis
      const pages = computePages(currentPage, totalPages);
      pages.forEach(p => {
        if (p === '...') {
          const el = document.createElement('span');
          el.className = 'pg-ellipsis';
          el.textContent = '…';
          nav.appendChild(el);
        } else {
          const b = mkBtn(String(p), () => goTo(p));
          if (p === currentPage) b.classList.add('active');
          nav.appendChild(b);
        }
      });

      // Next
      const next = mkBtn('<i class="fas fa-chevron-right"></i>', () => goTo(currentPage + 1));
      next.disabled = currentPage === totalPages;
      nav.appendChild(next);

      wrap.appendChild(nav);

      // Info text
      const info = document.createElement('div');
      info.className = 'pg-info';
      const start = (currentPage - 1) * PAGE_SIZE + 1;
      const end   = Math.min(currentPage * PAGE_SIZE, filtered.length);
      info.textContent = `Showing ${start}–${end} of ${filtered.length}`;
      wrap.appendChild(info);

      return wrap;
    }

    function mkBtn(html, onClick) {
      const b = document.createElement('button');
      b.className = 'pg-btn';
      b.innerHTML = html;
      b.addEventListener('click', onClick);
      return b;
    }

    function computePages(current, total) {
      const out = [];
      if (total <= 7) {
        for (let i = 1; i <= total; i++) out.push(i);
        return out;
      }
      out.push(1);
      if (current > 3) out.push('...');
      const s = Math.max(2, current - 1);
      const e = Math.min(total - 1, current + 1);
      for (let i = s; i <= e; i++) out.push(i);
      if (current < total - 2) out.push('...');
      out.push(total);
      return out;
    }

    function goTo(p) {
      currentPage = p;
      renderPage();
    }

    /* ---------- Search ---------- */
    function applySearch(q) {
      const term = q.toLowerCase().trim();
      if (!term) {
        filtered = allMatches.slice();
      } else {
        filtered = allMatches.filter(a => {
          const t = (a.title || a.name || '').toLowerCase();
          const s = (a.studio || a.type || '').toLowerCase();
          return t.includes(term) || s.includes(term);
        });
      }
      currentPage = 1;
      renderPage();
    }

    /* ---------- Helpers ---------- */
    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    /* ---------- Load anime ---------- */
    async function loadGenreAnime() {
      const container = document.getElementById('genreContent');
      try {
        if (window._persistenceReady) { try { await window._persistenceReady; } catch(_){} }

        const snap = await firebase.firestore().collection('anime').get();
        allMatches = [];
        snap.forEach(doc => {
          const d = doc.data();
          if (matchesGenre(d, genreName)) {
            allMatches.push({ firestoreId: doc.id, ...d });
          }
        });

        // Sort alphabetically by title
        allMatches.sort((a, b) =>
          String(a.title || '').localeCompare(String(b.title || ''))
        );

        loadSaved();
        filtered = allMatches.slice();
        currentPage = 1;
        renderPage();
      } catch (err) {
        console.error('Error loading genre:', err);
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-triangle-exclamation"></i>
            <h3>Something went wrong</h3>
            <p>${escapeHtml(err.message || 'Failed to load anime.')}</p>
          </div>`;
      }
    }

    /* ---------- Search wiring ---------- */
    const searchInput = document.getElementById('genreSearch');
    const clearBtn    = document.getElementById('genreSearchClear');
    let searchTimer = null;
    searchInput.addEventListener('input', (e) => {
      const v = e.target.value;
      clearBtn.classList.toggle('show', v.length > 0);
      clearTimeout(searchTimer);
      searchTimer = setTimeout(() => applySearch(v), 180);
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.remove('show');
      applySearch('');
      searchInput.focus();
    });

    loadGenreAnime();
  </script>

</body>
</html>
