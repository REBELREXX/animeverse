<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Stats — Anime Verse</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="style.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 0 0 60px;
    }

    body::before {
      content: '';
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 36px 36px;
    }

    .stats-topbar {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px;
      background: var(--bg);
      border-bottom: 1.5px solid var(--border);
    }
    .stats-topbar .logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 22px; letter-spacing: 2px;
    }
    .stats-topbar .logo span { color: var(--accent); }

    .top-right { display: flex; align-items: center; gap: 10px; }

    .badge-admin {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #000; font-size: 10px; font-weight: 900;
      padding: 3px 10px; border-radius: 20px;
      letter-spacing: 1px; text-transform: uppercase;
    }

    .back-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 10px; padding: 8px 14px;
      color: var(--text); font-family: 'Poppins', sans-serif;
      font-weight: 700; font-size: 13px; cursor: pointer;
      display: flex; align-items: center; gap: 6px;
      box-shadow: 0 4px 0 var(--btn-3d, rgba(0,0,0,0.4));
      transition: transform 0.1s, box-shadow 0.1s;
      text-decoration: none;
    }
    .back-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--btn-3d, rgba(0,0,0,0.4)); }

    .stats-wrap {
      position: relative; z-index: 1;
      max-width: 700px; margin: 0 auto;
      padding: 22px 16px;
    }

    .section-heading {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 16px;
    }
    .section-heading.spaced { justify-content: space-between; }
    .sh-left { display: flex; align-items: center; gap: 10px; }

    .section-heading .icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px; color: #fff; flex-shrink: 0;
    }
    .section-heading h2 { font-size: 15px; font-weight: 800; }
    .section-heading p  { font-size: 10px; color: var(--text2); font-weight: 600; }

    /* ── STAT GRID ── */
    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 12px; margin-bottom: 28px;
    }

    .stat-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 18px; padding: 16px 14px;
      position: relative; overflow: hidden;
      box-shadow: 0 6px 0 var(--btn-3d, rgba(0,0,0,0.35));
      transition: transform 0.12s, box-shadow 0.12s;
      animation: cardIn 0.5s cubic-bezier(0.22,1,0.36,1) both;
    }
    .stat-card:nth-child(1){animation-delay:.05s}
    .stat-card:nth-child(2){animation-delay:.10s}
    .stat-card:nth-child(3){animation-delay:.15s}
    .stat-card:nth-child(4){animation-delay:.20s}
    .stat-card:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--btn-3d, rgba(0,0,0,0.35)); }

    .stat-card::after {
      content: '';
      position: absolute; top: -28px; right: -28px;
      width: 80px; height: 80px; border-radius: 50%;
      opacity: 0.13;
    }
    .stat-card.c-today::after { background: #38BDF8; }
    .stat-card.c-yest::after  { background: #A78BFA; }
    .stat-card.c-month::after { background: #00E5A0; }
    .stat-card.c-users::after { background: #FB7185; }

    .card-icon {
      width: 36px; height: 36px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; margin-bottom: 10px;
      box-shadow: 0 4px 0 rgba(0,0,0,0.28);
    }
    .c-today .card-icon { background:#38BDF8; color:#fff; }
    .c-yest  .card-icon { background:#A78BFA; color:#fff; }
    .c-month .card-icon { background:#00E5A0; color:#000; }
    .c-users .card-icon { background:#FB7185; color:#fff; }

    .stat-label {
      font-size: 9px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text2); margin-bottom: 2px;
    }
    .stat-value {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 40px; line-height: 1; color: var(--text);
    }
    .stat-value.loading { opacity: 0.3; }
    .stat-sub { font-size: 10px; font-weight: 600; color: var(--text2); margin-top: 3px; }

    @keyframes cardIn {
      from { opacity:0; transform:translateY(18px) scale(0.96); }
      to   { opacity:1; transform:translateY(0) scale(1); }
    }

    .divider { height: 1.5px; background: var(--border); margin: 4px 0 24px; }

    /* ── ACTIVITY ── */
    .activity-list { display: flex; flex-direction: column; gap: 10px; }

    .act-card {
      background: var(--card-bg);
      border: 1.5px solid var(--border);
      border-radius: 14px; padding: 13px 14px;
      display: flex; align-items: center; gap: 12px;
      box-shadow: 0 4px 0 var(--btn-3d, rgba(0,0,0,0.3));
      animation: cardIn 0.4s cubic-bezier(0.22,1,0.36,1) both;
      overflow: hidden;
    }

    .av-pic {
      width: 44px; height: 44px; border-radius: 50%;
      object-fit: cover; border: 2px solid var(--accent);
      flex-shrink: 0;
    }
    .av-init {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--accent); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 900; flex-shrink: 0;
      border: 2px solid var(--accent);
    }

    .act-info { flex: 1; min-width: 0; }
    .act-name {
      font-size: 13px; font-weight: 800; color: var(--text);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .act-email {
      font-size: 10px; color: var(--text2); font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      margin-bottom: 5px;
    }
    .anime-pill {
      display: inline-flex; align-items: center; gap: 5px;
      background: rgba(90,90,200,0.12);
      border: 1px solid rgba(90,90,200,0.3);
      border-radius: 20px; padding: 3px 10px;
      font-size: 10px; font-weight: 700; color: var(--accent);
      max-width: 100%; white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis;
    }
    .anime-pill i { font-size: 9px; flex-shrink: 0; }

    .act-time {
      font-size: 10px; font-weight: 700; color: var(--text2);
      text-align: right; flex-shrink: 0;
    }

    .live-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: #00E5A0; display: inline-block; margin-right: 3px;
      animation: pdot 1.5s infinite;
    }
    @keyframes pdot { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

    .refresh-btn {
      background: var(--card-bg); border: 1.5px solid var(--border);
      border-radius: 10px; padding: 7px 12px;
      color: var(--text2); font-family: 'Poppins', sans-serif;
      font-weight: 700; font-size: 12px; cursor: pointer;
      display: flex; align-items: center; gap: 5px;
      box-shadow: 0 3px 0 var(--btn-3d, rgba(0,0,0,0.3));
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .refresh-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--btn-3d, rgba(0,0,0,0.3)); }
    .refresh-btn.spin i { animation: spinR 0.7s linear infinite; }
    @keyframes spinR { to{transform:rotate(360deg)} }

    .skel {
      height: 66px; border-radius: 14px; margin-bottom: 10px;
      background: linear-gradient(90deg, var(--bg3) 25%, var(--border) 50%, var(--bg3) 75%);
      background-size: 200% 100%;
      animation: shim 1.4s infinite;
    }
    @keyframes shim { from{background-position:200% 0} to{background-position:-200% 0} }

    .empty-msg {
      text-align: center; padding: 40px 20px;
      color: var(--text2); font-weight: 600; font-size: 13px;
    }
    .empty-msg i { display: block; font-size: 30px; margin-bottom: 10px; opacity: 0.4; }

    /* access denied */
    #accessDenied {
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 80vh; text-align: center; padding: 30px;
    }
    #accessDenied i { font-size: 52px; color: #FB7185; margin-bottom: 14px; }
    #accessDenied h2 { font-size: 20px; font-weight: 900; margin-bottom: 6px; }
    #accessDenied p { font-size: 13px; color: var(--text2); font-weight: 600; }

    #statsContent { display: none; }
  </style>
</head>
<body>

  <div class="stats-topbar">
    <div class="logo">ANIME <span>VERSE</span></div>
    <div class="top-right">
      <span class="badge-admin"><i class="fas fa-shield-halved"></i> Admin</span>
      <a href="admin.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    </div>
  </div>

  <div id="accessDenied">
    <i class="fas fa-lock"></i>
    <h2>Access Denied</h2>
    <p>Only the admin can view this page.</p>
    <a href="index.html" style="margin-top:16px;display:inline-block;padding:10px 24px;background:var(--accent);color:#fff;border-radius:10px;font-weight:800;font-size:13px;text-decoration:none">Go Home</a>
  </div>

  <div id="statsContent">
    <div class="stats-wrap">

      <!-- VISIT STATS -->
      <div class="section-heading">
        <div class="icon" style="background:var(--accent);box-shadow:0 4px 12px rgba(90,90,200,.4)">
          <i class="fas fa-chart-line"></i>
        </div>
        <div>
          <h2>Site Visits</h2>
          <p>Real-time traffic overview</p>
        </div>
      </div>

      <div class="stat-grid">
        <div class="stat-card c-today">
          <div class="card-icon"><i class="fas fa-sun"></i></div>
          <div class="stat-label">Today</div>
          <div class="stat-value loading" id="v-today">0</div>
          <div class="stat-sub">visits today</div>
        </div>
        <div class="stat-card c-yest">
          <div class="card-icon"><i class="fas fa-moon"></i></div>
          <div class="stat-label">Yesterday</div>
          <div class="stat-value loading" id="v-yest">0</div>
          <div class="stat-sub">visits yesterday</div>
        </div>
        <div class="stat-card c-month">
          <div class="card-icon"><i class="fas fa-calendar-days"></i></div>
          <div class="stat-label">Last 30 Days</div>
          <div class="stat-value loading" id="v-month">0</div>
          <div class="stat-sub">total visits</div>
        </div>
        <div class="stat-card c-users">
          <div class="card-icon"><i class="fas fa-users"></i></div>
          <div class="stat-label">Total Users</div>
          <div class="stat-value loading" id="v-users">0</div>
          <div class="stat-sub">registered accounts</div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- ACTIVITY -->
      <div class="section-heading spaced">
        <div class="sh-left">
          <div class="icon" style="background:#FB7185;box-shadow:0 4px 12px rgba(251,113,133,.4)">
            <i class="fas fa-eye"></i>
          </div>
          <div>
            <h2><span class="live-dot"></span>Who Viewed What</h2>
            <p>Latest anime views by users</p>
          </div>
        </div>
        <button class="refresh-btn" id="refreshBtn" onclick="loadActivity()">
          <i class="fas fa-rotate-right"></i> Refresh
        </button>
      </div>

      <div class="activity-list" id="activityList"></div>

    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const ADMIN_EMAIL = 'rejaakif202@gmail.com';

    function dateStr(offset = 0) {
      const d = new Date();
      d.setDate(d.getDate() + offset);
      return d.toISOString().slice(0, 10);
    }

    function timeAgo(ts) {
      if (!ts) return '—';
      const sec = Math.floor((Date.now() - ts.toMillis()) / 1000);
      if (sec < 60)    return sec + 's ago';
      if (sec < 3600)  return Math.floor(sec/60) + 'm ago';
      if (sec < 86400) return Math.floor(sec/3600) + 'h ago';
      return Math.floor(sec/86400) + 'd ago';
    }

    function countUp(id, target) {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('loading');
      let v = 0;
      const step = Math.max(1, Math.ceil(target / 40));
      const t = setInterval(() => {
        v = Math.min(v + step, target);
        el.textContent = v;
        if (v >= target) clearInterval(t);
      }, 25);
    }

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    async function loadStats() {
      try {
        const [todayDoc, yesterdayDoc] = await Promise.all([
          db.collection('siteStats').doc(dateStr(0)).get(),
          db.collection('siteStats').doc(dateStr(-1)).get()
        ]);
        countUp('v-today', todayDoc.exists ? (todayDoc.data().count||0) : 0);
        countUp('v-yest',  yesterdayDoc.exists ? (yesterdayDoc.data().count||0) : 0);

        // Last 30 days
        const from = dateStr(-29);
        const monthSnap = await db.collection('siteStats').where('date','>=',from).get();
        let total = 0;
        monthSnap.forEach(d => total += (d.data().count||0));
        countUp('v-month', total);

        // Total users
        const usersSnap = await db.collection('users').get();
        countUp('v-users', usersSnap.size);
      } catch(e) {
        ['v-today','v-yest','v-month','v-users'].forEach(id => {
          const el = document.getElementById(id);
          if (el) { el.classList.remove('loading'); el.textContent = '—'; }
        });
      }
    }

    async function loadActivity() {
      const list = document.getElementById('activityList');
      const btn  = document.getElementById('refreshBtn');
      btn.classList.add('spin');
      list.innerHTML = '<div class="skel"></div><div class="skel"></div><div class="skel"></div>';

      try {
        const snap = await db.collection('userActivity')
          .orderBy('lastSeen','desc').limit(40).get();

        if (snap.empty) {
          list.innerHTML = '<div class="empty-msg"><i class="fas fa-ghost"></i>No activity yet. Users appear here once they view an anime.</div>';
          btn.classList.remove('spin'); return;
        }

        list.innerHTML = '';
        snap.forEach((doc, i) => {
          const d     = doc.data();
          const name  = d.displayName || d.email || 'Unknown';
          const email = d.email || '';
          const photo = d.photoURL || '';
          const anime = d.lastViewed?.animeTitle || '—';
          const ts    = d.lastSeen;

          const avatar = photo
            ? `<img class="av-pic" src="${esc(photo)}" onerror="this.outerHTML='<div class=av-init>${esc(name.charAt(0).toUpperCase())}</div>'">`
            : `<div class="av-init">${esc(name.charAt(0).toUpperCase())}</div>`;

          const card = document.createElement('div');
          card.className = 'act-card';
          card.style.animationDelay = (i * 0.05) + 's';
          card.innerHTML = `
            ${avatar}
            <div class="act-info">
              <div class="act-name">${esc(name)}</div>
              <div class="act-email">${esc(email)}</div>
              <div class="anime-pill"><i class="fas fa-play-circle"></i>${esc(anime)}</div>
            </div>
            <div class="act-time">${timeAgo(ts)}</div>
          `;
          list.appendChild(card);
        });
      } catch(e) {
        list.innerHTML = `<div class="empty-msg"><i class="fas fa-triangle-exclamation"></i>Error: ${esc(e.message)}</div>`;
      }
      btn.classList.remove('spin');
    }

    auth.onAuthStateChanged(user => {
      if (user && user.email === ADMIN_EMAIL) {
        document.getElementById('statsContent').style.display = 'block';
        loadStats();
        loadActivity();
      } else {
        document.getElementById('accessDenied').style.display = 'flex';
      }
    });
  </script>
</body>
</html>
