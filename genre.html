<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genre — Anime Verse</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <style>
    /* ============ PAGE LAYOUT ============ */
    .genre-page {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px 16px 100px;
    }
    .genre-header {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 10px 0 18px;
      flex-wrap: wrap;
    }
    .genre-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(32px, 6vw, 48px);
      letter-spacing: 2px;
      margin: 0;
      color: var(--text, #fff);
      text-transform: uppercase;
    }
    .genre-title .accent {
      color: var(--accent, #FB3640);
    }
    .genre-count {
      color: var(--text2, #aaa);
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      margin-left: auto;
      background: var(--bg3, rgba(255,255,255,0.06));
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border, rgba(255,255,255,0.08));
      font-weight: 700;
    }

    /* ============ SEARCH BAR ============ */
    .genre-search-wrap {
      position: relative;
      margin: 0 0 24px;
    }
    .genre-search {
      width: 100%;
      padding: 14px 46px 14px 46px;
      border-radius: 14px;
      border: 1.5px solid var(--border, rgba(255,255,255,0.10));
      background: var(--bg2, rgba(255,255,255,0.04));
      color: var(--text, #fff);
      font-family: 'Poppins', sans-serif;
      font-size: 14px;
      font-weight: 600;
      outline: none;
      transition: all .25s ease;
      box-sizing: border-box;
    }
    .genre-search:focus {
      border-color: var(--accent, #FB3640);
      background: var(--bg3);
      box-shadow: 0 0 0 4px rgba(251,54,64,0.12);
    }
    .genre-search::placeholder { color: var(--text2, #888); font-weight: 500; }
    .genre-search-icon {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--accent, #FB3640);
      font-size: 15px;
      pointer-events: none;
    }
    .genre-search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: 0;
      color: var(--text2, #888);
      cursor: pointer;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: none;
      align-items: center;
      justify-content: center;
      transition: all .2s;
    }
    .genre-search-clear:hover {
      background: rgba(251,54,64,0.15);
      color: var(--accent, #FB3640);
    }
    .genre-search-clear.show { display: flex; }

    /* ============ GRID — 2 PER ROW ============ */
    .genre-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
    }

    /* ============ PREMIUM SQUARE CARD ============ */
    .g-card {
      position: relative;
      background: var(--card-bg, #0A1A10);
      border: 1.5px solid var(--border, rgba(255,255,255,0.08));
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--btn-3d, #B01E25), 0 6px 14px var(--shadow, rgba(0,0,0,0.5));
      transition: all 0.25s cubic-bezier(.4,0,.2,1);
      animation: gFadeUp .5s ease both;
      text-decoration: none;
      display: block;
    }
    .g-card:hover {
      transform: translateY(-6px) scale(1.02);
      border-color: var(--accent, #FB3640);
      box-shadow: 0 10px 0 var(--btn-3d, #B01E25), 0 14px 28px var(--shadow, rgba(0,0,0,0.6));
    }
    .g-card:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 var(--btn-3d, #B01E25);
    }

    .g-card .poster {
      width: 100%;
      aspect-ratio: 16 / 10;
      object-fit: cover;
      display: block;
      background: var(--bg3, #111);
      transition: transform .4s ease;
    }
    .g-card:hover .poster { transform: scale(1.06); }

    .g-card .heart {
      position: absolute;
      top: 10px;
      right: 10px;
      width: 32px;
      height: 32px;
      border-radius: 10px;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 13px;
      z-index: 4;
      border: 1px solid rgba(255,255,255,0.15);
      transition: all .2s;
    }
    .g-card .heart:hover { color: var(--accent, #FB3640); transform: scale(1.1); background: rgba(0,0,0,0.6); }
    .g-card .heart.saved { color: var(--accent, #FB3640); }

    /* Aurora info panel */
    .g-card .info {
      padding: 10px 10px 12px;
      position: relative;
      z-index: 2;
      background: linear-gradient(135deg, #030908, #0e1f18, #FB3640, #0e1f18, #030908);
      background-size: 400% 400%;
      animation: cardShine 4s ease infinite;
    }
    :root[data-theme="light"] .g-card .info {
      background: linear-gradient(135deg, #0D0A4A, #27187E, #758BFD, #27187E, #0D0A4A);
      background-size: 400% 400%;
    }

    .g-card .badge {
      display: inline-block;
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 9px;
      letter-spacing: 0.8px;
      color: #fff;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255,255,255,0.20);
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .g-card .t {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 12px;
      color: #fff;
      margin: 0 0 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.3;
      height: 2.6em;
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
    }
    .g-card .m {
      font-size: 11px;
      color: rgba(255,255,255,0.75);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: 'Poppins', sans-serif;
      font-weight: 700;
    }
    .g-card .m .rating { color: #FFD700; display: flex; align-items: center; gap: 4px; }
    .g-card .m .year { color: rgba(255,255,255,0.65); font-weight: 600; font-size: 10px; }

    /* ============ PAGINATION ============ */
    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin: 32px 0 12px;
      flex-wrap: wrap;
    }
    .pg-btn {
      min-width: 38px;
      height: 38px;
      padding: 0 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border, rgba(255,255,255,0.10));
      background: var(--bg3, rgba(255,255,255,0.04));
      color: var(--text, #fff);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all .2s ease;
      box-shadow: 0 3px 0 var(--btn-3d);
    }
    .pg-btn:hover:not(:disabled) {
      border-color: var(--accent, #FB3640);
      color: var(--accent, #FB3640);
      transform: translateY(-2px);
    }
    .pg-btn:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 var(--btn-3d);
    }
    .pg-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; }
    .pg-btn.active {
      background: var(--accent, #FB3640);
      color: #fff;
      border-color: var(--accent, #FB3640);
      transform: scale(1.05);
    }
    .pg-ellipsis { color: var(--text2, #888); padding: 0 4px; font-weight: 800; }
    .pg-info { width: 100%; text-align: center; color: var(--text2, #888); font-size: 12px; font-weight: 600; margin-top: 10px; }

    /* ============ STATES ============ */
    .empty-state, .loading-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--text2, #888);
      font-family: 'Poppins', sans-serif;
      grid-column: 1 / -1;
    }
    .empty-state i, .loading-state i {
      font-size: 44px;
      margin-bottom: 16px;
      color: var(--accent, #FB3640);
      opacity: 0.4;
    }
    .spinner {
      width: 44px; height: 44px;
      border: 4px solid rgba(251,54,64,0.15);
      border-top-color: var(--accent, #FB3640);
      border-radius: 50%;
      margin: 0 auto 16px;
      animation: spin 1s linear infinite;
    }

    /* ============ ANIMATIONS ============ */
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes cardShine {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes gFadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Mobile override for 2-column consistency */
    @media (max-width: 768px) {
      .genre-grid { gap: 10px; }
      .g-card { border-radius: 12px; }
      .g-card .info { padding: 8px 8px 10px; }
      .g-card .t { font-size: 11px; height: 2.6em; }
    }
  </style>
</head>
<body class="genre-body">

  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <a href="index.html" class="icon-btn" title="Back">
        <i class="fas fa-arrow-left"></i>
      </a>
      <a href="index.html" class="logo">ANIME <span>VERSE</span></a>
    </div>
    <div class="header-right">
      <button class="icon-btn" id="themeBtn" onclick="toggleTheme()">
        <i class="fas fa-moon"></i>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="genre-page">
      <div class="genre-header">
        <h1 class="genre-title" id="genreTitle">GENRE</h1>
        <div class="genre-count" id="genreCount">0 results</div>
      </div>

      <div class="genre-search-wrap">
        <i class="fas fa-search genre-search-icon"></i>
        <input type="text" class="genre-search" id="genreSearch" placeholder="Search in this genre..." autocomplete="off">
        <button class="genre-search-clear" id="genreSearchClear">
          <i class="fas fa-times"></i>
        </button>
      </div>

      <div id="genreContent">
        <div class="loading-state">
          <div class="spinner"></div>
          <p>Loading premium collection...</p>
        </div>
      </div>

      <div id="genrePagination"></div>
    </div>
  </main>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js"></script>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const genreName = urlParams.get('name') || 'Anime';
    document.getElementById('genreTitle').innerHTML = genreName.toUpperCase();
    document.title = genreName + ' — Anime Verse';

    const PAGE_SIZE = 16;
    let allMatches = [];
    let filtered   = [];
    let currentPage = 1;
    let savedSet    = new Set();

    /* ---------- Theme ---------- */
    function toggleTheme() {
      const html = document.documentElement;
      const btn  = document.getElementById('themeBtn');
      const dark = html.getAttribute('data-theme') === 'dark';
      html.setAttribute('data-theme', dark ? 'light' : 'dark');
      btn.innerHTML = dark ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
      localStorage.setItem('av_theme', dark ? 'light' : 'dark');
    }
    function loadTheme() {
      const saved = localStorage.getItem('av_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', saved);
      const btn = document.getElementById('themeBtn');
      if (btn) btn.innerHTML = saved === 'dark' ? '<i class="fas fa-moon"></i>' : '<i class="fas fa-sun"></i>';
    }
    loadTheme();

    /* ---------- Watchlist ---------- */
    function loadSaved() {
      const user = firebase.auth().currentUser;
      if (!user) {
        const local = JSON.parse(localStorage.getItem('av_watchlist') || '[]');
        savedSet = new Set(local.map(String));
      } else {
        firebase.firestore().collection('users').doc(user.uid).get().then(doc => {
          if (doc.exists) {
            const list = doc.data().watchlist || [];
            savedSet = new Set(list.map(String));
            renderPage();
          }
        });
      }
    }

    async function toggleSaved(id, btn) {
      const user = firebase.auth().currentUser;
      const idStr = String(id);
      if (savedSet.has(idStr)) {
        savedSet.delete(idStr);
        btn.classList.remove('saved');
      } else {
        savedSet.add(idStr);
        btn.classList.add('saved');
      }

      if (!user) {
        localStorage.setItem('av_watchlist', JSON.stringify([...savedSet]));
      } else {
        await firebase.firestore().collection('users').doc(user.uid).set({
          watchlist: [...savedSet]
        }, { merge: true });
      }
    }

    /* ---------- Logic ---------- */
    function matchesGenre(anime, target) {
      if (!anime.genre || !Array.isArray(anime.genre)) return false;
      return anime.genre.some(g => g.toLowerCase() === target.toLowerCase());
    }

    function renderPage() {
      const container = document.getElementById('genreContent');
      const pagWrap   = document.getElementById('genrePagination');
      const countEl   = document.getElementById('genreCount');

      countEl.textContent = `${filtered.length} results`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-search"></i>
            <h3>No results found</h3>
            <p>Try searching for a different title in this genre.</p>
          </div>`;
        pagWrap.innerHTML = '';
        return;
      }

      const totalPages = Math.max(1, Math.ceil(filtered.length / PAGE_SIZE));
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const start = (currentPage - 1) * PAGE_SIZE;
      const end   = start + PAGE_SIZE;
      const slice = filtered.slice(start, end);

      const grid = document.createElement('div');
      grid.className = 'genre-grid';

      slice.forEach((a, i) => {
        const card = document.createElement('div');
        card.className = 'g-card';
        card.style.animationDelay = (i * 0.05) + 's';

        // Use Banner Thumbnail first for premium wide look
        const poster = a.banner || a.thumbnail || '';
        const title  = a.title || 'Untitled';
        const year   = a.year || '';
        const rating = a.rating || '';
        const type   = (a.type || 'ANIME').toString().toUpperCase();
        const isSaved = savedSet.has(a.firestoreId);

        card.innerHTML = `
          <img class="poster" src="${poster}" alt="${escapeHtml(title)}" loading="lazy"
               onerror="this.style.background='#222';this.removeAttribute('src');">
          <button class="heart ${isSaved ? 'saved' : ''}" aria-label="Save">
            <i class="${isSaved ? 'fas' : 'far'} fa-heart"></i>
          </button>
          <div class="info">
            <span class="badge">${escapeHtml(type)}</span>
            <p class="t">${escapeHtml(title)}</p>
            <div class="m">
              <span class="rating"><i class="fas fa-star"></i>${rating || 'N/A'}</span>
              <span class="year">${escapeHtml(String(year))}</span>
            </div>
          </div>`;

        // Heart button
        const heartBtn = card.querySelector('.heart');
        heartBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const icon = heartBtn.querySelector('i');
          toggleSaved(a.firestoreId, heartBtn);
          if (savedSet.has(a.firestoreId)) { icon.classList.remove('far'); icon.classList.add('fas'); }
          else { icon.classList.remove('fas'); icon.classList.add('far'); }
        });

        // Navigate on card click
        card.addEventListener('click', () => {
          window.location.href = 'anime.html?id=' + encodeURIComponent(a.firestoreId);
        });

        grid.appendChild(card);
      });

      container.innerHTML = '';
      container.appendChild(grid);

      // Pagination
      pagWrap.innerHTML = '';
      pagWrap.appendChild(buildPagination(totalPages));

      // Smooth scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function buildPagination(totalPages) {
      const wrap = document.createElement('div');
      const nav  = document.createElement('div');
      nav.className = 'pagination';

      // Prev
      const prev = mkBtn('<i class="fas fa-chevron-left"></i>', () => goTo(currentPage - 1));
      prev.disabled = currentPage === 1;
      nav.appendChild(prev);

      // Page numbers
      const pages = computePages(currentPage, totalPages);
      pages.forEach(p => {
        if (p === '...') {
          const el = document.createElement('span');
          el.className = 'pg-ellipsis';
          el.textContent = '…';
          nav.appendChild(el);
        } else {
          const b = mkBtn(String(p), () => goTo(p));
          if (p === currentPage) b.classList.add('active');
          nav.appendChild(b);
        }
      });

      // Next
      const next = mkBtn('<i class="fas fa-chevron-right"></i>', () => goTo(currentPage + 1));
      next.disabled = currentPage === totalPages;
      nav.appendChild(next);

      wrap.appendChild(nav);

      // Info
      const info = document.createElement('div');
      info.className = 'pg-info';
      const start = (currentPage - 1) * PAGE_SIZE + 1;
      const end   = Math.min(currentPage * PAGE_SIZE, filtered.length);
      info.textContent = `Showing ${start}–${end} of ${filtered.length}`;
      wrap.appendChild(info);

      return wrap;
    }

    function mkBtn(html, onClick) {
      const b = document.createElement('button');
      b.className = 'pg-btn';
      b.innerHTML = html;
      b.addEventListener('click', onClick);
      return b;
    }

    function computePages(current, total) {
      const out = [];
      if (total <= 5) { for (let i = 1; i <= total; i++) out.push(i); return out; }
      out.push(1);
      if (current > 3) out.push('...');
      const s = Math.max(2, current - 1);
      const e = Math.min(total - 1, current + 1);
      for (let i = s; i <= e; i++) out.push(i);
      if (current < total - 2) out.push('...');
      out.push(total);
      return out;
    }

    function goTo(p) { currentPage = p; renderPage(); }

    function applySearch(q) {
      const term = q.toLowerCase().trim();
      if (!term) { filtered = allMatches.slice(); }
      else {
        filtered = allMatches.filter(a => (a.title || '').toLowerCase().includes(term));
      }
      currentPage = 1;
      renderPage();
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    async function loadGenreAnime() {
      const container = document.getElementById('genreContent');
      try {
        const snap = await firebase.firestore().collection('anime').get();
        allMatches = [];
        snap.forEach(doc => {
          const d = doc.data();
          if (d.published !== false && matchesGenre(d, genreName)) {
            allMatches.push({ firestoreId: doc.id, ...d });
          }
        });

        allMatches.sort((a, b) => String(a.title || '').localeCompare(String(b.title || '')));
        loadSaved();
        filtered = allMatches.slice();
        currentPage = 1;
        renderPage();
      } catch (err) {
        container.innerHTML = `<div class="empty-state"><p>Error loading collection.</p></div>`;
      }
    }

    const searchInput = document.getElementById('genreSearch');
    const clearBtn    = document.getElementById('genreSearchClear');
    searchInput.addEventListener('input', (e) => {
      const v = e.target.value;
      clearBtn.classList.toggle('show', v.length > 0);
      applySearch(v);
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      clearBtn.classList.remove('show');
      applySearch('');
      searchInput.focus();
    });

    loadGenreAnime();
  </script>
</body>
</html>
